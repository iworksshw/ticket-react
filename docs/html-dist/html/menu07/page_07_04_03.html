<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 인증</title>
</head>
<body style="margin: 0; padding: 0; font-family: '돋움', Dotum, '맑은고딕', 'Malgun Gothic', sans-serif; background-color:#ffffff; color:#000000;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center">
                <table border="0" cellspacing="0" cellpadding="0" style="max-width: 800px; margin: 0 auto; padding: 40px 40px 100px 40px;">
                    <!-- 헤더 -->
                    <tr align="left">
                        <td style="padding-bottom: 20px; border-bottom: 1px solid #111111;">
                            <img src="/common/images/email/ic_180_email_logo.svg" alt="AREX 로고">
                        </td>
                    </tr>
                    <!-- 본문 -->
                    <tr>
                        <td style="padding-top: 40px;">
                            <h2 style="color:#107AF2; font-size: 30px; font-weight: bold; margin: 0; letter-spacing: -1.5px; line-height: 45px;">비밀번호 재설정 인증</h2>
                        </td>
                    </tr>
                    <tr>
                        <td style="color: #000000; font-size: 18px; line-height: 28.8px; letter-spacing: -0.9px; padding: 20px 0 40px 0; font-weight: 400;">
                            <p>
                                안녕하세요. <span style="text-decoration: underline; font-weight: bold; letter-spacing: -0.9px;">id@domain.com</span> 님<br>
                                이 메일은 공항철도 직통열차예약시스템에 입력하신 귀하의 비밀번호 재설정을 하기 위해 전송되었습니다.<br>
                                아래 ‘비밀번호 변경하기’를 클릭하여 연결된 페이지에 인증번호를 입력하여 비밀번호 재설정을 완료해 주세요.
                            </p>
                        </td>
                    </tr>
                    <!-- 인증번호 박스 -->
                    <tr align="center">
                        <td style="padding: 32px 20px; color: #000000; background-color:#EEF7FF; font-size: 22px; font-weight: bold; line-height: 35.2px; letter-spacing: -1.1px;">
                        인증번호 : <span>599875</span>
                        </td>
                    </tr>
                    <!-- 안내 문구 -->
                    <tr>
                        <td style="font-size: 18px; color: #000000; letter-spacing: -0.9px; line-height: 28.8px; padding: 20px 0 60px 0;">
                        <p style="margin:0;">
                            <img src="/common/images/email/ic_24_question.svg" alt="아이콘" style="vertical-align: middle; padding-right: 4px;">인증메일 유효시간은 메일 수신일 기준 30분 이내입니다.
                        </p>
                        </td>
                    </tr>
                    <!-- 버튼 -->
                    <tr>
                        <td align="center">
                            <table border="0" cellspacing="0" cellpadding="0" style="border-radius: 8px; background-color: #107AF2; width: 280px; font-size: 20px;">
                            <tr>
                                <td align="center" style="padding: 16px 24px; width: 280px; font-size: 20px;">
                                    <a href="javascript:void(0)" style="display: block; font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: -1px; text-decoration: none; line-height: 32px; width: 100%;">
                                        비밀번호 재설정하기
                                    </a>
                                </td>
                            </tr>
                            </table>
                        </td>
                    </tr>                  
                </table>
                <table border="0" cellspacing="0" cellpadding="0" style="max-width: 800px; margin: 0 auto;">
                    <!-- 푸터 -->
                    <tr>
                        <td>
                            <img src="/common/images/email/bg_footer.jpg" alt="(22694)인천광역시 서구 검바위로 46(검암동) 공항철도(주), 전화 1599-7788, 팩스 032-745-8899, 사업자등록번호 101-81-68490" style="width: 100%; max-width: 800px; display: block;">
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
