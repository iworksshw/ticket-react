	<title>공항철도</title>

	<link rel="preload" as="style" href="/common/css/swiper.css">
	<link rel="preload" as="style" href="/common/css/style.css">

	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">	
	<link rel="stylesheet" href="/common/css/swiper.css">

	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>

	<script src="/common/js/tui-time-picker.js"></script>

<body>
<div class="skip"><a class="quickBtn" href="#container">본문바로가기</a></div>
<div class="wrap">

<!-- 레이아웃 -->
<div class="lytMember">
    <div class="memberArea">

        <!-- 상단영역 -->
        <div class="memberTop">
            <!-- Top -->
            <div class="topArea">
                <div class="logoArea"><a href="javascript:void(0)"><img src="/common/images/common/ic_142_logo.svg" alt="arex 로고"></a></div>
                <div class="langArea">
                    <div class="comDropdown">
                        <div class="dropArea">
                            <button class="btnDrop" type="button">
                                한국어
                            </button>
                            <ul class="dropMenu">
                                <li><a href="javascript:void(0)">영어</a></li>
                                <li><a href="javascript:void(0)">중국어</a></li>
                                <li><a href="javascript:void(0)">일본어</a></li>
                            </ul>
                        </div>
                    </div>
                    <!-- 20250922 버튼 추가 -->
                    <button class="closeBtn" type="button">
                        <span class="blind">전체메뉴 닫기</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- //상단영역 -->

        <!-- 중단영역 -->
        <div class="memberContainer" id="container">

            <!-- 서브 콘텐츠 영역 -->
            <div class="memberSubCont">

                <div class="cptLogin">
                    <div class="loginArea">
                        <div class="loginTop">
                            <h1 class="loginHeadline">비밀번호 변경안내</h1>
                            <p class="loginHeadText">회원님의 개인정보를 안전하게 보호하고, 개인정보 도용으로 인한 피해를 예방하기 위해 정기적으로 비밀번호 변경을 권장하고 있습니다.</p>
                        </div>
                        <div class="loginCont">
                            
                            <!-- 비밀번호 확인/등록 영역-->
                            <div class="comLog">
                                <div class="fnCont">
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="passNow">현재 비밀번호</label>
                                        </div>
                                        <div class="frmGroup error">
                                            <div class="frmBox">
                                                <input type="text" class="iptText lg" id="passNow" placeholder="비밀번호를 입력해주세요." name="passNow">
                                                <button class="btnReset">텍스트 지우기</button>
                                                <span class="errMsg">비밀번호를 입력해주세요.(영문, 숫자 조합 10~20자)</span><!-- 20251211 수정 -->
                                            </div>
                                        </div>
                                    </div>
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="passAfter">새 비밀번호</label>
                                        </div>
                                        <div class="frmGroup error">
                                            <div class="frmBox">
                                                <input type="password" class="iptText lg" id="passAfter" placeholder="신규 비밀번호를 입력해주세요." name="passAfter">
                                                <button class="btnReset">텍스트 지우기</button>
                                            </div>
                                        </div>
                                        <div class="chkGroup">
                                            <div class="chkItem chkBlue">10~20자</div> <!-- 클래스명 => chkGray : off 기본 / chkBlue : on 상태 -->
                                            <div class="chkItem chkGray">영문</div>
                                            <div class="chkItem chkGray">숫자</div>
                                        </div>
                                    </div>
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="passwordCfm">비밀번호 확인</label>
                                        </div>
                                        <div class="frmGroup error">
                                            <div class="frmBox">
                                                <input type="password" class="iptText lg" id="passwordCfm" placeholder="비밀번호를 입력해주세요." name="passwordCfm"><!-- 20251211 수정 -->
                                                <button class="btnReset">텍스트 지우기</button>
                                                <span class="errMsg">비밀번호가 일치하지 않습니다.</span><!-- 20251211 수정 -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="btmBtn">
                                <button type="button" class="btn dkLine lg">30일 후에 변경</button>
                                <button type="button" class="btn dkBlue lg">비밀번호 변경</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            <!-- //서브 콘텐츠 영역 -->

        </div>
        <!-- //중단영역 -->

    </div>
</div>


<!-- Bottom -->

</div>
</body>
</html>
