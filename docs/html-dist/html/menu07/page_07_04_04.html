<div class="wrap">

<!-- 레이아웃 -->
<div class="lytMember">
    <div class="memberArea">

        <!-- 상단영역 -->
        <div class="memberTop">
            <!-- Top -->
            <div class="topArea">
                <div class="logoArea"><a href="javascript:void(0)"><img src="/common/images/common/ic_142_logo.svg" alt="arex 로고"></a></div>
                <div class="langArea">
                    <div class="comDropdown">
                        <div class="dropArea">
                            <button class="btnDrop" type="button">
                                한국어
                            </button>
                            <ul class="dropMenu">
                                <li><a href="javascript:void(0)">영어</a></li>
                                <li><a href="javascript:void(0)">중국어</a></li>
                                <li><a href="javascript:void(0)">일본어</a></li>
                            </ul>
                        </div>
                    </div>
                    <!-- 20250922 버튼 추가 -->
                    <button class="closeBtn" type="button">
                        <span class="blind">전체메뉴 닫기</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- //상단영역 -->

        <!-- 중단영역 -->
        <div class="memberContainer" id="container">

            <!-- 서브 콘텐츠 영역 -->
            <div class="memberSubCont">

                <div class="cptLogin">
                    <div class="loginArea">
                        <div class="loginTop">
                            <h1 class="loginHeadline">비밀번호 재설정</h1>
                            <p class="loginHeadText">이메일에서 확인한 인증번호와 새로운 비밀번호를 입력해주세요.</p>
                        </div>
                        <div class="loginCont">
                            
                            <!-- 비밀번호 확인/등록 영역-->
                            <div class="comLog">
                                <div class="fnCont">
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="authCode">인증번호</label>
                                        </div>
                                        <div class="frmGroup error">
                                            <div class="frmBox">
                                                <input type="text" class="iptText lg" id="authCode" placeholder="인증번호 6자리" name="authCode">
                                                <button class="btnReset">텍스트 지우기</button>
                                                <span class="errMsg">유효하지 않은 인증번호입니다.</span><!-- 20251211 수정 -->
                                            </div>
                                        </div>
                                    </div>
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="password">비밀번호</label>
                                        </div>
                                        <div class="frmGroup">
                                            <div class="frmBox">
                                                <input type="password" class="iptText lg" id="password" placeholder="비밀번호를 입력해주세요." name="password">
                                                <button class="btnReset">텍스트 지우기</button>
                                            </div>
                                        </div>
                                        <div class="chkGroup">
                                            <div class="chkItem chkBlue">10~20자</div> <!-- 클래스명 => chkGray : off 기본 / chkBlue : on 상태 -->
                                            <div class="chkItem chkGray">영문</div>
                                            <div class="chkItem chkGray">숫자</div>
                                        </div>
                                    </div>
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="passwordCfm">비밀번호 확인</label>
                                        </div>
                                        <div class="frmGroup error">
                                            <div class="frmBox">
                                                <input type="password" class="iptText lg" id="passwordCfm" placeholder="비밀번호를 입력해주세요." name="passwordCfm"><!-- 20251211 수정 -->
                                                <button class="btnReset">텍스트 지우기</button>
                                                <span class="errMsg">비밀번호가 일치하지 않습니다.</span><!-- 20251211 수정 -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="btmBtn">
                                <button type="button" class="btn dkBlue lg" disabled>확인</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            <!-- //서브 콘텐츠 영역 -->

        </div>
        <!-- //중단영역 -->
