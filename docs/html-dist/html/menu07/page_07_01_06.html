<div class="lytMember">
    <div class="memberArea">

        <!-- 상단영역 -->
        <div class="memberTop">
            <!-- Top -->
            <div class="topArea">
                <div class="logoArea"><a href="javascript:void(0)"><img src="/common/images/common/ic_142_logo.svg" alt="arex 로고"></a></div>
                <div class="langArea">
                    <div class="comDropdown">
                        <div class="dropArea">
                            <button class="btnDrop" type="button">
                                한국어
                            </button>
                            <ul class="dropMenu">
                                <li><a href="javascript:void(0)">영어</a></li>
                                <li><a href="javascript:void(0)">중국어</a></li>
                                <li><a href="javascript:void(0)">일본어</a></li>
                            </ul>
                        </div>
                    </div>
                    <!-- 20250922 버튼 추가 -->
                    <button class="closeBtn" type="button">
                        <span class="blind">전체메뉴 닫기</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- //상단영역 -->

        <!-- 중단영역 -->
        <div class="memberContainer" id="container">

            <!-- 서브 콘텐츠 영역 -->
            <div class="memberSubCont">

                <div class="cptLogin">
                    <div class="loginArea">
                        <div class="loginTop">
                            <strong class="eyebrow">공항철도 회원가입</strong>
                            <h1 class="loginHeadline">선택 정보 입력</h1>
                            <p class="loginHeadText">고객님의 편리한 서비스 이용을 위해 회원정보를 등록하세요.</p>
                        </div>
                        <div class="loginCont">
                            
                            <!-- 필수정보입력 영역 -->
                            <div class="comLog">
                                <div class="fnCont">
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="nation1">국적</label>
                                        </div>
                                        <div class="frmGroup">
                                            <select name="nation1" id="nation1" class="iptSlt lg"><!-- 20251128 수정 -->
                                                <option value="" disabled selected>대륙 정보를 선택해 주세요.</option> <!-- 텍스트 수정 200251014 -->
                                                <option value="">동북아시아</option>
                                                <option value="">동남아시아</option>
                                            </select>
                                        </div>
                                        <div class="frmGroup">
                                            <select name="nation2" id="nation2" class="iptSlt lg" aria-label="두 번째 국적">
                                                <option value="" disabled selected>국적을 선택해주세요.</option>
                                                <option value="">대한민국</option>
                                                <option value="">태국</option>
                                            </select>                                    
                                        </div>
                                    </div>   
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="birth">출생년도</label>
                                        </div>
                                        <div class="frmGroup">
                                            <select name="birth" id="birth" class="iptSlt lg">
                                                <option value="">2000</option>
                                                <option value="">1999</option>
                                            </select>
                                        </div>
                                    </div>      
                                    <div class="fnGroup">
                                        <div class="labelBox" id="genderLabel">성별</div>
                                        <div class="fnChoGroup" role="radiogroup" aria-labelledby="genderLabel"> <!-- 202151217 수정 -->
                                            <div class="frmChoBox">
                                                <input id="rdo301" type="radio" class="iptRdo" name="rdo301">
                                                <label for="rdo301" class="iptLbl">남자</label>
                                            </div>
                                            <div class="frmChoBox">
                                                <input id="rdo302" type="radio" class="iptRdo" name="rdo301">
                                                <label for="rdo302" class="iptLbl">여자</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="fnGroup">
                                        <div class="labelBox">
                                            <label for="nationCode">전화번호</label>
                                        </div>
                                        <div class="frmGroup">
                                            <select name="nationCode" id="nationCode" class="iptSlt lg">
                                                <option value="" disabled="" selected="">국가코드를 선택하세요.</option>
                                                <option value="">+82 대한민국</option>
                                                <option value="">+82 대한민국</option>
                                            </select>
                                        </div>
                                        <div class="frmGroup">
                                            <div class="frmBox">
                                                <label for="phoneNum" class="blind">전화번호</label><!-- 20251128 수정 -->
                                                <input type="tel" class="iptText lg" id="phoneNum" placeholder="전화번호를 숫자만 입력해 주세요." name="phoneNum">
                                                <button class="btnReset">텍스트 지우기</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="btmBtn">
                                <button type="button" class="btn dkLine lg">다음에 등록</button>
                                <button type="button" class="btn dkBlue lg">등록완료</button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
            <!-- //서브 콘텐츠 영역 -->

        </div>
