<body>
<div class="skip"><a class="quickBtn" href="#container">본문바로가기</a></div>
<div class="wrap">

<!-- 레이아웃 -->
<div class="lytLayout">
    <div class="layoutArea">

    </div>
</div>

<!-- 팝업영역 -->
<div id="sample01" class="modPopup md on"> <!-- class - on : 팝업오픈 -->
    <div class="popupDim">딤영역</div>
    <div class="popupArea"> <!-- style - 너비값(width), 높이값(height) : 팝업 너비 및 높이 지정 -->
        <div class="popupInMotion">
            <div class="popupContainer">
                <div class="popupContArea">
                    <button type="button" class="btnPopClose" onclick="closePopup('sample01');">닫기</button>
                    <div class="popTitle">상품 반품신청내역</div>
                    <div class="popCont">
                        <!-- 팝업 컨텐츠 영역 -->
                        <div class="comReturn">
                            <div class="txtBox">
                                <p class="tit">사용흔적이 없는 상품만 <em>교환/반품</em>이 가능합니다.</p>
                                <p class="subTit">회수된 상품을 검수한 후 문제가 발견되면 고객님께 연락을 드립니다.</p>
                            </div>
                            <div class="contBox">
                                <p class="topTit">반품신청 상품 및 수량선택</p>
                                <div class="comTicketGoods">
                                    <ul class="goodsList">

                                        <li class="item">
                                            <dl class="info">
                                                <dt class="tit"><span>5,000원 충전된 교통카드 / </span> <span class="colorBlue">긴 옵션 내용1, 긴 옵션 내용2</span></dt>
                                                <dd class="desc">
                                                    <div class="goodsNum">2개</div>
                                                </dd>
                                            </dl>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="contBox">
                                <p class="topTit">반품사유</p>
                                <div class="comTicketDiscount">
                                    <ul class="discountList">
                                        <li class="discItem left">
                                            <div class="returnRes">
                                                <p class="txt">기타 사유 : <span class="detailTxt">반품사유 기재 내용</span></p>
                                            </div>
                                        </li>                                                                                     
                                    </ul>
                                </div>
                            </div>
                            <div class="contBox">
                                <p class="topTit">반품처</p>
                                <div class="comTicketDiscount">
                                    <ul class="discountList">
                                        <li class="discItem center">
                                            <div class="returnList">
                                                <p class="loc">오프라인 서울</p>
                                                <p class="txt">서울역 오프라인판매처</p>
                                                <p class="tel">고객센터 : 02-0000-0000</p>
                                            </div>
                                        </li>                                                                                     
                                    </ul>
                                </div>
                                <p class="pubText">* 반품처리상태 : <em class="varColorBlue">반품신청</em></p>
                            </div>
                        </div>
                        <!-- //팝업 컨텐츠 영역 -->
                    </div>
                    
                    <!-- 팝업 하단 영역 -->
                    <div class="popBtm division">
                        <div class="alignC">
                            <div class="btnBox cta">
                                <button type="button" class="btn dkLine">취소</button>
                                <button type="button" class="btn blue">확인</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</div>
