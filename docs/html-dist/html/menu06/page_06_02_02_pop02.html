<body>
<div class="skip"><a class="quickBtn" href="#container">본문바로가기</a></div>
<div class="wrap">

<!-- 레이아웃 -->
<div class="lytLayout">
    <div class="layoutArea">

    </div>
</div>

<!-- 팝업영역 -->
<div id="sample01" class="modPopup md on"> <!-- class - on : 팝업오픈 -->
    <div class="popupDim">딤영역</div>
    <div class="popupArea"> <!-- style - 너비값(width), 높이값(height) : 팝업 너비 및 높이 지정 -->
        <div class="popupInMotion">
            <div class="popupContainer">
                <div class="popupContArea">
                    <button type="button" class="btnPopClose" onclick="closePopup('sample01');">닫기</button>
                    <div class="popTitle">오는열차 인원 확인</div>
                    <div class="popCont">
                        <!-- 팝업 컨텐츠 영역 -->
                        <p class="pubText">
                            오는열차 인원 수를 확인해 주세요.
                        </p>
                        <div class="comTicketPass">
                            <ul class="passengersList">
                                <li class="item">
                                    <div class="alignL">
                                        <span>학생/인솔자<i>(신청인원 20명)</i></span>
                                    </div>
                                    <div class="alignR">
                                        <div class="pubIncDec">
                                            <button class="btnNum minus" disabled="">-1</button>
                                            <span class="textNum">0<span class="blind">명</span></span>
                                            <button class="btnNum plus">+1</button>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <div class="comTicketBox type02">
                            <div class="boxArea">
                                <ul class="boxList">
                                    <li class="item">오는열차 승차권 운임은 모든 연령 동일 8,000원입니다.</li>
                                </ul>
                            </div>
                        </div>
                        <em class="pubText varTextC mt40">오는열차 총 <span class="varColorBlue">3</span>명을 신청 하시겠습니까?</em>
                        <!-- //팝업 컨텐츠 영역 -->
                    </div>
                    
                    <!-- 팝업 하단 영역 -->
                    <div class="popBtm division">
                        <div class="alignC">
                            <div class="btnBox cta">
                                <button type="button" class="btn dkLine">취소</button>
                                <button type="button" class="btn blue">인원 확인</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
