<body>
<div class="skip"><a class="quickBtn" href="#container">본문바로가기</a></div>
<div class="wrap">

<!-- 레이아웃 -->
<div class="lytLayout">
    <div class="layoutArea">

    </div>
</div>

<!-- 팝업영역 -->
<div id="sample01" class="modPopup md on"> <!-- class - on : 팝업오픈 -->
    <div class="popupDim">딤영역</div>
    <div class="popupArea"> <!-- style - 너비값(width), 높이값(height) : 팝업 너비 및 높이 지정 -->
        <div class="popupInMotion">
            <div class="popupContainer">
                <div class="popupContArea">
                    <button type="button" class="btnPopClose" onclick="closePopup('sample01');">닫기</button>
                    <div class="popTitle">체험학습 문의</div>
                    <div class="popCont">
                        <!-- 팝업 컨텐츠 영역 -->
                        <p class="pubText">
                            신청하신 체험학습에 대한 문의 내용을 작성해 주세요. <br>
                            담당자 확인 후 답변 드리겠습니다.
                        </p>
                        <div class="comTableForm">
                            <table class="formTable">
                                <caption>체험학습 문의(제목, 내용을 포함한 표)</caption><!-- 20251217 수정 -->
                                <!-- 20251217 수정 -->
                                <colgroup>
                                    <col style="width:160px;">
                                    <col>
                                </colgroup>
                                <!--// 20251217 수정 -->
                                <tbody>
                                    <tr>
                                        <th class="left" scope="row">제목</th>
                                        <td>
                                            <div class="frmGroup">
                                                <div class="frmBox">
                                                    <input type="text" class="iptText" placeholder="제목을 입력해 주세요." title="제목입력">
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="left" scope="row">내용</th>
                                        <td>
                                            <textarea class="iptTextArea" placeholder="내용을 입력해 주세요." title="내용 입력"></textarea><!-- 20251211 수정 -->
                                        </td>
                                    </tr>
                                </tbody>
                            </table>                                                
                        </div>
                        <!-- //팝업 컨텐츠 영역 -->
                    </div>
                    
                    <!-- 팝업 하단 영역 -->
                    <div class="popBtm division">
                        <div class="alignC">
                            <div class="btnBox cta">
                                <button type="button" class="btn dkLine">취소</button>
                                <button type="button" class="btn blue">인원 확인</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom -->

</div>
