        <dt class="question" title="답변 닫힘">(직통열차) 예매한 승차권을 취소하였는데 카드 환불을 언제 받을 수 있나요?</dt>
        <dd class="answer" style="display: none;">
            <div class="answerText">
                취소된 승차권의 환불 소요기간은 결제하신 카드사마다 상이합니다. 이에 정확한 확인을 위해 이용하신 카드사에 문의해 주실 것을 요청드립니다.
            </div>
        </dd>
    </dl>
    <dl class="qnaBox">
        <dt class="question">(역사) 마곡나루역 영문명이 Magongnaru 인 이유는 무엇인가요?</dt>
        <dd class="answer">
            <div class="answerText">
                공항철도 열차 출발시각은 출입문이 닫히는 시각이 아닌 열차가 정상적으로 출발할 수 있도록 사전 조치(열차 출입문 및 승강장안전문 취급,열차 진로 신호의 정상작동 여부 지적확인 등)를 모두 마치고 열차가 정상적으로 출발할 수 있는 시각을 의미하며, 상기조치에 약 10여초 정도 소요됨을 알려드립니다.(공항철도 시각표는 출발시각 기준임)
                <br><br>
                혼잡한 역사에서 고객안전을 위하여 여객 승하차를 위한 출입문 취급 시간이 다소 길어지는 경우 다소 늦게 출발하는 경우도 발생될 수 있으나 우리회사는 다음 도착 역사의 연쇄지연 방지를 위해 정시운행을 준수하고자 최선을 다하고 있습니다.
            </div>
        </dd>
    </dl>
    <dl class="qnaBox">

        <dd class="answer">
            <div class="answerText">
                <ul>
                    <li>
                        보안관련규정에 의해 정해진 사항 이외에도 항공보안을 해칠 수 있는 모든 상황이나 사실에 대하여 신고가 가능합니다.
                    </li>
                </ul>
            </div>
        </dd>
    </dl>
    <dl class="qnaBox">
