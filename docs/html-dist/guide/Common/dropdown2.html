<script>

/* run(); 함수와 충돌이 있어서 소스가 길어짐, 사용시에는 아래의 run 함수 한줄 제거 후 사용하기 */

/* run() 함수가 있으면 실행 => 소스 가져가서 쓰실땐 아래 run 함수 제거 후 사용 해주세요. */
if (typeof run === "function") run();



/* 드롭다운2 초기화 */
function initDropdowns() {
    const dropdowns = document.querySelectorAll(".comDropdown2");

    dropdowns.forEach(dropdown => {
        const btn = dropdown.querySelector(".btnDrop");
        const menu = dropdown.querySelector(".dropMenu");
        if (!btn || !menu) return;

        // 초기 상태
        btn.setAttribute("title", "열림");
        menu.hidden = true;

        // 닫기
        const close = () => {
            btn.setAttribute("title", "열림");
            menu.hidden = true;
            btn.classList.remove("open");
        };

        // 열기
        const open = () => {
            // 드롭다운 2개일때, 하나만 열리도록 처리
            dropdowns.forEach(d => {
                if (d !== dropdown) {
                    const b = d.querySelector(".btnDrop");
                    const m = d.querySelector(".dropMenu");
                    if (b && m) {
                        b.setAttribute("title", "열림");
                        m.hidden = true;
                        b.classList.remove("open");
                    }
                }
            });

            // 자기 자신 열기
            btn.setAttribute("title", "닫힘");
            menu.hidden = false;
            btn.classList.add("open");

        };

        // 토글 메뉴 클릭
        const toggle = () => (btn.getAttribute("title") === "닫힘" ? close() : open());
        btn.addEventListener("click", e => { 
            e.stopPropagation(); 
            toggle(); 
        });

        // 외부 클릭 시 닫기
        document.addEventListener("click", e => { 
            if (!dropdown.contains(e.target)) close(); 
        });

        // 드롭다운 메뉴 마지막에서 tab키 누르면 닫기
        const items = menu.querySelectorAll("li a, li button, li [tabindex]:not([tabindex='-1'])");
        if (items.length > 0) {
            const lastItem = items[items.length - 1];
            lastItem.addEventListener("keydown", e => {
                if (e.key === "Tab" && !e.shiftKey) { 
                    close(); 
                }
            });
        }

    });
}
// DOM 준비 시 초기화
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initDropdowns);
} else {
    initDropdowns();
}

</script>
