<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>회원 인증 영역</title>
</head>
<body>
    <!--
        SCSS
        scss/component/ (별도 파일 없음 — 레이아웃 내 단순 래퍼)
    -->

    <!-- 회원 인증 영역 -->
    <div class="cptMember">
        <div class="pubTitH3">
            <h3>서비스를 이용하기 위해서는 승차권조회 <span class="varColorBlue">인증</span>이 필요합니다.</h3>
        </div>
    </div>

    <!-- 예약방식 (comMemberSelect) -->
    <div class="comMemberSelect">
        <ul class="memberList">
            <li class="mbItem">
                <button type="button" class="mbBox member icon001">
                    <span class="memberTxt">회원 승차권 조회</span>
                </button>
            </li>
            <li class="mbItem">
                <button type="button" class="mbBox noMember icon002">
                    <span class="memberTxt">비회원 승차권 조회</span>
                </button>
            </li>
        </ul>
    </div>
</body>
</html>
