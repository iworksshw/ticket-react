<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/common.js"></script>
    <title>로그인 폼</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comLog.scss
    -->

    <!-- 로그인 폼 -->
    <div class="comLog">
        <div class="fnTxtCont">
            <p class="fnTxt">고객님 이메일(<em>id@domain.com</em>)로 회원가입을 위한<br>
                <em>‘인증번호’</em>를 발송했습니다.<br>
                인증메일 유효시간은 메일 수신일 기준 <em>30분 이내</em>입니다.
            </p>
        </div>
        <div class="fnCont">
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="authCodeRe">인증번호</label>
                </div>
                <div class="frmGroup">
                    <div class="frmBox">
                        <input type="text" class="iptText lg" id="authCodeRe" placeholder="인증번호 6자리" name="authCodeRe">
                    </div>
                    <button type="button" class="btn dkLine lg">인증번호 재전송</button>
                </div>
            </div>
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="authCode">인증번호</label>
                </div>
                <div class="frmGroup">
                    <div class="frmBox">
                        <input type="text" class="iptText lg" id="authCode" placeholder="인증번호 6자리" name="authCode">
                    </div>
                </div>
            </div>
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="password">비밀번호</label>
                </div>
                <div class="frmGroup error">
                    <div class="frmBox">
                        <input type="password" class="iptText lg" id="password" placeholder="비밀번호를 입력해주세요." name="password">
                        <button class="btnReset">텍스트 지우기</button>
                    </div>
                </div>
                <div class="chkGroup">
                    <div class="chkItem chkBlue">10~20자</div> <!-- 클래스명 => chkGray : off 기본 / chkBlue : on 상태 -->
                    <div class="chkItem chkGray">영문</div>
                    <div class="chkItem chkGray">숫자</div>
                </div>
            </div>
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="passwordCfm">비밀번호 확인</label>
                </div>
                <div class="frmGroup error">
                    <div class="frmBox">
                        <input type="password" class="iptText lg" id="passwordCfm" placeholder="비밀번호를 입력해주세요." name="passwordCfm" aria-describedby="passwordCfmError">
                        <button class="btnReset">텍스트 지우기</button>
                        <span class="errMsg" id="passwordCfmError">비밀번호가 일치하지 않습니다.</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="fnCont">
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="nation1">국적</label>
                </div>
                <div class="frmGroup">
                    <select name="nation1" id="nation1" class="iptSlt lg" aria-label="첫 번째 국적">
                        <option value="" disabled="" selected="">국적을 선택해주세요.</option>
                        <option value="">동북아시아</option>
                        <option value="">동남아시아</option>
                    </select>
                </div>
                <div class="frmGroup">
                    <select name="nation2" id="nation2" class="iptSlt lg" aria-label="두 번째 국적">
                        <option value="" disabled="" selected="">국적을 선택해주세요.</option>
                        <option value="">대한민국</option>
                        <option value="">태국</option>
                    </select>                                    
                </div>
            </div>   
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="birth">출생년도</label>
                </div>
                <div class="frmGroup">
                    <select name="birth" id="birth" class="iptSlt lg">
                        <option value="">2000</option>
                        <option value="">1999</option>
                    </select>
                </div>
            </div>      
            <div class="fnGroup">
                <div class="labelBox" id="genderLabel">성별</div>
                <div class="fnChoGroup" aria-labelledby="genderLabel">
                    <div class="frmChoBox">
                        <input id="rdo301" type="radio" class="iptRdo" name="rdo301">
                        <label for="rdo301" class="iptLbl">남자</label>
                    </div>
                    <div class="frmChoBox">
                        <input id="rdo302" type="radio" class="iptRdo" name="rdo301">
                        <label for="rdo302" class="iptLbl">여자</label>
                    </div>
                </div>
            </div>
            <div class="fnGroup">
                <div class="labelBox">
                    <label for="nationCode">전화번호</label>
                </div>
                <div class="frmGroup">
                    <select name="nationCode" id="nationCode" class="iptSlt lg">
                        <option value="" disabled="" selected="">국가코드를 선택하세요.</option>
                        <option value="">+82 대한민국</option>
                        <option value="">+82 대한민국</option>
                    </select>
                </div>
                <div class="frmGroup">
                    <div class="frmBox">
                        <input type="tel" class="iptText lg" id="phoneNum" placeholder="전화번호를 숫자만 입력해 주세요." name="phoneNum" aria-label="전화번호 입력">
                        <button class="btnReset">텍스트 지우기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
