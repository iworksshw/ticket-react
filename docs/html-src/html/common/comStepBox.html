<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>단계별 절차 박스</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comStepBox.scss
    -->

    <!-- 단계별 절차 박스 -->
    <div class="comStepBox">
        <div class="stepBoxArea">
            <div class="cont">
                <div class="icBox"><img src="/common/images/common/ic_60_ticket.png" alt=""></div>
                <div class="contBox">
                    <dl>
                        <dt class="tit"><em>STEP 1.</em> 단계 제목</dt>
                        <dd class="desc">
                            단계 설명 텍스트
                            <ul class="descArea">
                                <li class="item">세부 항목 1</li>
                                <li class="item">세부 항목 2</li>
                            </ul>
                        </dd>
                    </dl>
                </div>
            </div>
            <div class="cont">
                <div class="icBox"><img src="/common/images/common/ic_60_baggage.png" alt=""></div>
                <div class="contBox">
                    <dl>
                        <dt class="tit"><em>STEP 2.</em> 단계 제목</dt>
                        <dd class="desc">
                            단계 설명 텍스트
                            <ul class="descArea">
                                <li class="item">세부 항목 1</li>
                                <li class="item"><em>강조 항목</em> : 내용</li>
                            </ul>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
