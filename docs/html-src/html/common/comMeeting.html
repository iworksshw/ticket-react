<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>이력조회검색바</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comMeeting.scss
    -->

    <!-- 이력조회검색바 -->
    <div class="comMeeting">
        <div class="meetingArea">
            <div class="meetingDate ticket">
                <div class="tit">조회일</div>
                <div class="fnGroupWrap">
                    <div class="frmGroup frmGroupBe">
                        <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                            <input id="startpicker-input" type="text" title="조회일 기간검색 시작일">
                            <div id="startpicker-container"></div>
                        </div>
                    </div>
                    <div aria-hidden="true" class="deco">~</div>
                    <div class="frmGroup frmGroupAf">
                        <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                            <input id="endpicker-input" type="text" title="조회일 기간검색 종료일">
                            <div id="endpicker-container"></div>
                        </div>
                    </div>
                    <div class="frmGroup">
                        <div class="frmChoBox"><input id="chk01" type="checkbox" class="iptChk sm"><label for="chk01" class="iptLbl">전체(승차권+상품)</label></div>
                        <div class="frmChoBox"><input id="chk02" type="checkbox" class="iptChk sm"><label for="chk02" class="iptLbl">승차권</label></div>
                        <div class="frmChoBox"><input id="chk03" type="checkbox" class="iptChk sm"><label for="chk03" class="iptLbl">상품</label></div>
                    </div>
                </div>
                <button type="button" class="btn dkBlue">조회</button>
            </div>
        </div>
    </div>
</body>
</html>
