<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">	
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<!-- <link rel="stylesheet" href="../common/css/jquery-ui.min.css" /> -->
	
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>할인선택</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comDiscount.scss
    -->

    <!-- 할인선택 -->
    <div class="comDiscount">
        <div class="ticketInfo">
            <div class="inner">
                <div class="seatPlan">
                    <span class="carNum">5호차</span>
                    <span class="seatNum">5D</span>
                </div>
                <div class="price">
                    <div class="regular">
                        <span>운임</span>
                        <p>13,000원</p>
                    </div>
                    <div class="subtract">
                        <span class="blind">- 빼기</span>
                    </div>
                    <div class="discount">
                        <span>할인</span>
                        <p>3,500원</p>
                    </div>
                    <div class="equal">
                        <span class="blind">= 등호</span>
                    </div>
                    <div class="finalPrice">
                        <span>결제금액</span>
                        <p>9,500원</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
