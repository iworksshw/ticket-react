<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/style.css">
    <title>그룹 탑</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comGroupTop.scss
        scss/form/_frmGroup.scss
        scss/form/_frmBox.scss
        scss/form/_iptSlt.scss
        scss/form/_frmSearch.scss
        scss/form/_iptText.scss
    -->
    <div class="comGroupTop">
        <div class="alignL">
            <div class="unit"><span class="text">전체 <span class="total">999</span> 건</span></div>
        </div>
        <div class="alignR">
            <ul class="opList">
                <li class="item">
                    <div class="frmGroup">
                        <div class="frmBox">
                            <select class="iptSlt" title="검색 분류">
                                <option value="">전체</option>
                                <option value="">제목</option>
                                <option value="">내용</option>
                                <option value="">제목 + 내용</option>
                            </select>
                        </div>
                    </div>
                </li>
                <li class="item">
                    <div class="frmGroup">
                        <div class="frmSearch">
                            <input type="text" class="iptText" placeholder="검색어를 입력해주세요." title="검색어 입력">
                            <button class="btnSearch">검색</button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
