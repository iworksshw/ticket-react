<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>나의 쿠폰함</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comCoupon.scss
    -->

    <!-- 나의 쿠폰함 -->
    <div class="comCoupon">
        <!-- 보유쿠폰 -->
        <div class="couponBox">
            <div class="imgWrap">
                <span class="img" aria-hidden="true"></span>
                <span class="blind">쿠폰 arex</span>
            </div>
            <div class="txt">
                <p class="tit">2025년 도심공항터미널 우수 이용고객 리워드<i class="new">NEW</i></p>
                <p class="discount">US $7.56 <span class="won">(₩10,000)</span> 할인</p>
                <div class="date">
                    <p class="dateTxt">
                        유효기간 <span class="dateNum">2025-11-01 까지</span>
                    </p>
                </div>
            </div>
            <!-- imgCoupon : 쿠폰 아이콘 / blueTxt : 블루 컬러 텍스트 -->
            <button type="button" class="present">
                <span class="imgCoupon"></span>
                <span class="blueTxt">쿠폰선물</span>
            </button>
        </div>
        <!-- 선물로 받은 쿠폰 -->
        <div class="couponBox">
            <div class="imgWrap">
                <span class="img" aria-hidden="true"></span>
                <span class="blind">쿠폰 arex</span>
            </div>
            <div class="txt">
                <p class="tit">2025년 도심공항터미널 우수 이용고객 리워드<i class="gift">선물</i></p>
                <p class="discount">10,000원 할인</p>
                <div class="date">
                    <p class="dateTxt">
                        유효기간 <span class="dateNum">2025-11-01 까지</span>
                    </p>
                    <p class="dateTxt">
                        보낸사람 <span class="dateNum">email_id@domain.co.kr / 2026-11-01</span>
                    </p>
                </div>
            </div>
            <!-- imgGift : 받은 선물 아이콘 / darkTxt : 받은 선물 텍스트 -->
            <button type="button" class="present" disabled>
                <span class="imgGift"></span>
                <span class="darkTxt">받은선물</span>
            </button>
        </div>
    </div>
</body>
</html>
