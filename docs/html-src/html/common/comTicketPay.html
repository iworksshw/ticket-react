<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">

	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
    <title>결제 방법</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comTicketPay.scss
    -->

    <!-- 결제 방법 -->
    <div class="comTicketPay">
        <div class="payOption">
            <ul>
                <li>
                    <div class="radCov">
                        <div class="inner">
                            <input type="radio" name="pay" id="pay01" checked="">
                            <label for="pay01">신용카드</label>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="radCov">
                        <div class="inner">
                            <input type="radio" name="pay" id="pay02">
                            <label for="pay02">간편결제</label>
                        </div>
                    </div>
                </li>
            </ul>
        </div>

        <div class="payInfoBox">
            <div class="cont01 payCont on"> <!-- addClass : on - 컨텐츠 노출 -->
                <div class="cardList">
                    <div class="slideOption">
                        <button type="button" class="prev" tabindex="0" role="button" aria-label="이전 슬라이드">이전보기</button>
                        <button type="button" class="next" tabindex="0" role="button" aria-label="다음 슬라이드">다음보기</button>
                    </div>
                    <div class="swiper-container cardSlide">
                        <ul class="swiper-wrapper">
                            <li class="swiper-slide">
                                <input type="radio" name="card" id="card01">
                                <label for="card01">
                                    <span class="cardInfo">
                                        <span>카드별명</span>
                                        <span>1234-****-****-5678</span>
                                    </span>
                                </label>
                            </li>
                            <li class="swiper-slide">
                                <input type="radio" name="card" id="card02">
                                <label for="card02">
                                    <span class="cardInfo">
                                        <span>카드별명</span>
                                        <span>1234-****-****-5678</span>
                                    </span>
                                </label>
                            </li>
                            <li class="swiper-slide directType">
                                <input type="radio" name="card" id="direct">
                                <label for="direct">
                                    <span class="direct">
                                        <span>직접입력</span>
                                    </span>
                                </label>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="comTableForm">
                    <table class="formTable">
                        <caption>
                            결제 방법 목록_카드구분, 카드번호, 유효기간, 카드비밀번호, 카드종류, 인증번호로 구성된 표
                        </caption>
                        <colgroup>
                            <col style="width:200px;">
                            <col>
                        </colgroup>
                        <tbody>
                            <tr>
                                <th class="left">카드구분</th>
                                <td class="left">
                                    <div class="frmGroup">
                                        <div class="frmChoBox"><input id="rdo001" type="radio" class="iptRdo" name="rdo001" checked=""><label for="rdo001" class="iptLbl">국내 발급카드</label></div>
                                        <div class="frmChoBox"><input id="rdo002" type="radio" class="iptRdo" name="rdo001"><label for="rdo002" class="iptLbl">해외 발급카드</label></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="left">카드번호</th>
                                <td class="left">
                                    <div class="frmGroup gap04">
                                        <div class="frmBox">
                                            <input type="text" class="iptText" title="카드번호 첫번째" disabled="" value="1234">
                                        </div>
                                        <span>-</span>
                                        <div class="frmBox">
                                            <input type="text" class="iptText" title="카드번호 두번째">
                                        </div>
                                        <span>-</span>
                                        <div class="frmBox">
                                            <input type="text" class="iptText" title="카드번호 세번째">
                                        </div>
                                        <span>-</span>
                                        <div class="frmBox">
                                            <input type="text" class="iptText" title="카드번호 네번째">
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="left">유효기간</th>
                                <td class="left">
                                    <div class="frmGroup">
                                        <div class="frmBox frmTini">
                                            <input type="text" class="iptText" title="유효기간 월 입력">
                                            <span>월</span>
                                        </div>
                                        <div class="frmBox frmTini">
                                            <input type="text" class="iptText" title="유효기간 년 입력">
                                            <span>년</span>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="left">카드 비밀번호</th>
                                <td class="left">
                                    <div class="frmGroup gap08 moFull">
                                        <div class="frmBox frmTini">
                                            <input type="text" class="iptText" title="카드 비밀번호 입력">
                                        </div>
                                    </div>
                                    <div class="infoText">
                                        ※ 비밀번호 앞 2자리 입력
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="left">카드종류</th>
                                <td class="left">
                                    <div class="frmGroup">
                                        <div class="frmChoBox"><input id="rdo003" type="radio" class="iptRdo" name="rdo002" checked=""><label for="rdo003" class="iptLbl">개인</label></div>
                                        <div class="frmChoBox"><input id="rdo004" type="radio" class="iptRdo" name="rdo002"><label for="rdo004" class="iptLbl">법인</label></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="left">인증번호</th>
                                <td class="left">
                                    <div class="frmGroup gap08 moFull">
                                        <div class="frmBox frmTini">
                                            <input type="text" class="iptText" title="인증번호 입력">
                                        </div>
                                    </div>
                                    <div class="infoText">
                                        ※ 생년월일 6자리 입력
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="comAgreement">
                    <div class="agreeInner">
                        <div class="checkArea">
                            <div class="frmGroup">
                                <div class="frmChoBox"><input id="chk401" type="checkbox" class="iptChk sm"><label for="chk401" class="iptLbl"><em>[필수]</em> 개인정보 수집/이용 동의</label></div>
                            </div>
                        </div>
                        <div class="descArea">
                            <div class="descBox">
                                [개인정보의 수집 및 이용 목적]<br>
                                승차권 예약발매서비스 이용​<br><br>

                                [개인정보 수집 항목]<br>
                                카드번호, 유효기간​<br><br>

                                ▶개인정보 수집 및 이용 동의 거부​<br>
                                개인정보 수집 및 이용 동의를 거부하실 수 있습니다. 다만, 이 경우 승차권 예약 서비스 이용이 제한될 수 있습니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cont02 payCont on">
                <!-- 간편결제 선택 시 노출되는 영역 -->
                 <div class="easyPayBox">
                    <ul>
                        <li class="kakaopay">
                            <input type="radio" name="easyPay" id="easy01">
                            <label for="easy01">
                                <span class="blind">카카오페이</span>
                            </label>
                        </li>
                        <li class="paycopay">
                            <input type="radio" name="easyPay" id="easy02">
                            <label for="easy02">
                                <span class="blind">페이코페이</span>
                            </label>
                        </li>
                        <li class="creditCard01">
                            <input type="radio" name="easyPay" id="easy03">
                            <label for="easy03">
                                <span>신용/체크카드</span>
                                <span>(해외 발급카드)</span>
                            </label>
                        </li>
                        <li class="creditCard02">
                            <input type="radio" name="easyPay" id="easy04">
                            <label for="easy04">
                                <span>신용/체크카드</span>
                                <span>(국내 발급카드)</span>
                            </label>
                        </li>
                        <li class="alipay">
                            <input type="radio" name="easyPay" id="easy05">
                            <label for="easy05">
                                <span class="blind">알리페이</span>
                            </label>
                        </li>
                        <li class="wechatpay">
                            <input type="radio" name="easyPay" id="easy06">
                            <label for="easy06">
                                <span class="blind">위챗페이</span>
                            </label>
                        </li>
                        <li class="kbpay">
                            <input type="radio" name="easyPay" id="easy07">
                            <label for="easy07">
                                <span class="blind">케이비 페이</span>
                            </label>
                        </li>
                        <li class="samsungpay">
                            <input type="radio" name="easyPay" id="easy08">
                            <label for="easy08">
                                <span class="blind">삼성페이</span>
                            </label>
                        </li>                                                         
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
