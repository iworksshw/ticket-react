<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/style.css">
    <title>예약방식</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comMemberSelect.scss
    -->
    <!-- 예약방식 -->
    <div class="comMemberSelect">
        <ul class="memberList">
            <li class="mbItem">
                <button type="button" class="mbBox member icon001">
                    <span class="memberTxt">회원 예약</span>
                </button>
            </li>
            <li class="mbItem">
                <button type="button" class="mbBox noMember icon002">
                    <span class="memberTxt">비회원 예약</span>
                </button>
            </li>
        </ul>
        <div class="mbMsg">
            <p>아직 공항철도 회원 가입하지 않으셨나요?<br>간단한 회원가입으로 500원 승차권 할인 혜택을 받으세요.</p>
        </div>
        <ul class="mbMenu">
            <li class="mbLink"><a href="#" target="_blank" title="새 창 열림">신규 회원가입</a></li>
        </ul>
    </div>
</body>
</html>
