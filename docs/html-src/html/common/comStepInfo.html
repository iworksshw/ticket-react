<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/style.css">
    <title>신청절차</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comStepInfo.scss
    -->

    <!-- 신청절차 -->
    <div class="comStepInfo">
        <ul class="stepList">
            <li class="stepItem icon001">
                <i class="eyebrow">STEP 1</i>
                <em class="tit">로그인</em>
                <span class="desc">공항철도 홈페이지 로그인</span>
            </li>
            <li class="stepItem icon002">
                <i class="eyebrow">STEP 2</i>
                <em class="tit">예약신청</em>
                <span class="desc">신청기간 내 예약 가능</span>
            </li>
            <li class="stepItem icon006">
                <i class="eyebrow">STEP 3</i>
                <em class="tit">신청접수</em>
                <span class="desc">담당자 확인</span>
            </li>
            <li class="stepItem icon007">
                <i class="eyebrow">STEP 4</i>
                <em class="tit">세부일정 발송</em>
                <span class="desc">일정 확정 후 개별 발송</span>
            </li>
            <li class="stepItem icon008">
                <i class="eyebrow">STEP 5</i>
                <em class="tit">신청완료</em>
                <span class="desc">신청결과 개별 안내</span>
            </li>
        </ul>
    </div>
</body>
</html>
