<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>콘텐츠 하단 총 결제금액</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comTotalPriceBtm.scss
    -->

    <!-- 콘텐츠 하단 총 결제금액 -->
    <div class="comTotalPriceBtm">
        <dl class="info">
            <dt class="tit">승차권</dt>
            <dd class="desc">
                <span class="bold">0원</span>
            </dd>
        </dl>
        <dl class="info">
            <dt class="tit">상품</dt>
            <dd class="desc">
                <span class="bold">-3,000원</span>
            </dd>
        </dl>
        <dl class="info">
            <dt class="tit">변경 수수료</dt>
            <dd class="desc">
                <span class="bold">US $1.81</span>
                <span class="won">(₩2,000)</span>
            </dd>
        </dl>
        <dl class="info">
            <dt class="tit">총 결제 금액</dt>
            <dd class="desc">
                <span class="bold colorBlue">-1,000원</span>
            </dd>
        </dl>
    </div>
</body>
</html>
