<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>취소수수료</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comCharge.scss
    -->

    <!-- 취소수수료 -->
    <div class="comCharge">
        <p class="title">회의실 AREX B2-4</p>
        <div class="dateCalcu">
            <ul>
                <li>
                    <div class="inner">
                        <span>이용일</span>
                        <div class="frmGroup">
                            <div class="frmBox">
                                <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                    <input id="startpicker-input" type="text" title="이용일 선택">
                                    <div id="startpicker-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="inner">
                        <span>취소일</span>
                        <div class="frmGroup">
                            <div class="frmBox frmMd">
                                <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                    <input id="endpicker-input" type="text" title="취소일 선택">
                                    <div id="endpicker-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </li>
                <li>
                    <button type="button" class="btn gLine">계산하기</button>
                </li>
            </ul>
        </div>
        <div class="comTableBasic">
            <table>
                <caption>취소수수료_결제금액, 취소수수료, 환불금액에 관한 표</caption>
                <colgroup>
                    <col style="width:160px;">
                    <col>
                </colgroup>
                <tbody>
                    <tr>
                        <th scope="row">결제금액</th>
                        <td>80,000원</td>
                    </tr>
                    <tr>
                        <th scope="row">취소수수료</th>
                        <td>0원</td>
                    </tr>
                    <tr>
                        <th scope="row">환불금액</th>
                        <td>80,000원</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <span class="pubCaption gray">당일 예약건에 한해서 이용일시 이전에는 100% 환불 됩니다.</span>
    </div>

    <script>datePickerTo("startpicker-input", "startpicker-container", "endpicker-input", "endpicker-container");</script>
</body>
</html>
