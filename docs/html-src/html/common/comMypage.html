<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>마이페이지 예약카드</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comMypage.scss
    -->

    <!-- 마이페이지 예약카드 -->
    <div class="comMypage">
        <div class="mypageWrap">
            <div class="mypageArea">
                <a href="#" class="link">
                    <div class="contBox">
                        <div class="top">
                            <div class="dateBox">
                                <p class="dateTxt">체험일</p>
                                <p class="date">2025-11-01(수)</p>
                            </div>
                        </div>
                        <div class="middle">
                            <div class="txt">회의실 AREX-B1-1 <span>16:00~18:00 (2시간)</span></div>
                        </div>
                        <div class="base">
                            <p class="formerTxt">위치 <span class="latterTxt">서울역 지하1층</span></p>
                            <p class="formerTxt">이용료 <span class="latterTxt">￦ 70,000 원</span></p>
                            <p class="formerTxt">신청일 <span class="latterTxt">2025-11-01</span></p>
                            <p class="formerTxt">예약번호 <span class="latterTxt">MB20250826009</span></p>
                        </div>
                    </div>
                    <div class="stateBox">
                        <!-- class : cancel => 예약취소 / confirmWait => 승인대기 / payWait => 결제대기 / payComplete => 결제완료 -->
                        <p class="state cancel">예약취소</p>
                    </div>
                </a>
            </div>
            <div class="mypageArea">
                <a href="#" class="link">
                    <div class="contBox">
                        <div class="top">
                            <div class="dateBox">
                                <p class="dateTxt">체험일</p>
                                <p class="date">2025-11-01(수)</p>
                            </div>
                        </div>
                        <div class="middle">
                            <div class="txt">회의실 AREX-B1-1 <span>16:00~18:00 (2시간)</span></div>
                        </div>
                        <div class="base">
                            <p class="formerTxt">위치 <span class="latterTxt">서울역 지하1층</span></p>
                            <p class="formerTxt">이용료 <span class="latterTxt">￦ 70,000 원</span></p>
                            <p class="formerTxt">신청일 <span class="latterTxt">2025-11-01</span></p>
                            <p class="formerTxt">예약번호 <span class="latterTxt">MB20250826009</span></p>
                        </div>
                    </div>
                    <div class="stateBox">
                        <!-- class : cancel => 예약취소 / confirmWait => 승인대기 / payWait => 결제대기 / payComplete => 결제완료 -->
                        <p class="state payComplete">결제완료</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
