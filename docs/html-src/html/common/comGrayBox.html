<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>회색 정보 박스</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comGrayBox.scss
    -->

    <!-- 회색 정보 박스 (텍스트+이미지 좌우 정렬) -->
    <div class="comGrayBox">
        <dl class="boxGroup">
            <dt class="boxTitle">
                <em>소제목</em>
                <span>부제목</span>
            </dt>
            <dd class="boxCont">
                <div class="alignBox">
                    <div class="alignL">
                        <em>01.</em> 안내 텍스트 1<br>
                        <em>02.</em> 안내 텍스트 2<br>
                        <em>03.</em> 안내 텍스트 3
                        <span class="pubRefer bold">※ 참고 텍스트는 <span class="yellow">강조 키워드</span>로 표기됩니다</span>
                    </div>
                    <div class="alignR">
                        <img src="/common/images/contents/cont_03_04_13_10.png" alt="참고 이미지">
                    </div>
                </div>
            </dd>
        </dl>
    </div>
    
    <div class="comGrayBox">
        <p class="boxCont varTextC">예약이 취소되었습니다.</p>
    </div>
</body>
</html>
