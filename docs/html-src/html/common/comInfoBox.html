<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>정보 박스</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comInfoBox.scss
    -->

    <!-- 기본형 (icon001: 아이콘 있는 유형) -->
    <div class="comInfoBox">
        <div class="boxArea icon001">
            <div class="infoCont">
                <dl class="infoBox">
                    <dt class="tit"><em>정보 제목</em></dt>
                    <dd class="desc">정보 설명 텍스트가 들어갑니다.</dd>
                </dl>
            </div>
        </div>
    </div>

    <!-- 이미지 포함형 (.comInfoBoxImg) -->
    <div class="comInfoBox comInfoBoxImg">
        <div class="boxArea">
            <div class="imgGroup">
                <div class="imgArea">
                    <img src="/common/images/contents/cont_03_04_08_01.jpg" alt="정보 이미지">
                </div>
            </div>
            <div class="infoCont">
                <dl class="infoBox">
                    <dt class="tit"><em>정보 제목</em></dt>
                    <dd class="desc">
                        <ul class="pubTextList">
                            <li class="textListItem"><em>항목명</em> : 항목 내용</li>
                            <li class="textListItem"><em>항목명</em> : 항목 내용</li>
                        </ul>
                    </dd>
                </dl>
            </div>
        </div>
    </div>
</body>
</html>
