<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>제휴서비스</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comPartner.scss
    -->

    <!-- 제휴서비스 — 리스트형 -->
    <div class="comPartner">
        <div class="partnerBox partnerList" role="button" tabindex="0">
            <div class="boxTxt">
                <p class="tit">카페 드 스카이</p>
                <dl class="listBox">
                    <dt class="listTit">혜택</dt>
                    <dd class="listDesc">음료 가격의 10% 할인 (세트메뉴, 푸드, MD 상품 제외)</dd>
                </dl>
            </div>
            <div class="boxImg">
                <img src="/common/images/common/logo_cafeSky.png" alt="카페 드 스카이 로고">
            </div>
        </div>
        <div class="partnerBox partnerList" role="button" tabindex="0">
            <div class="boxTxt">
                <p class="tit">더 라운지</p>
                <dl class="listBox">
                    <dt class="listTit">혜택</dt>
                    <dd class="listDesc">인천국제공항라운지 43.3% 할인</dd>
                </dl>
            </div>
            <div class="boxImg">
                <img src="/common/images/common/logo_lounge.png" alt="더 라운지 로고">
            </div>
        </div>
        <div class="comBtnGroup">
            <div class="alignC cta">
                <button type="button" class="btn blue lg">확인</button>
            </div>
        </div>
    </div>
</body>
</html>
