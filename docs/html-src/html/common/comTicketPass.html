<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/tui-date-picker.css">
	<link rel="stylesheet" href="/common/css/tui-time-picker.css">	
	<link rel="stylesheet" href="/common/css/swiper.css">
	<link rel="stylesheet" href="/common/css/style.css">
	<!-- <link rel="stylesheet" href="../common/css/jquery-ui.min.css" /> -->
	
	<script src="/common/js/swiper.js"></script>
	<script src="/common/js/common.js"></script>
	<script src="/common/js/tui-date-picker.js"></script>
	<script src="/common/js/tui-time-picker.js"></script>
    <title>탑승인원선택</title>
</head>
<body>
    <!--
        SCSS
        scss/common/_comTicketPass.scss
        scss/public/_pubIncDec.scss
    -->

    <!-- 탑승인원선택 -->
    <div class="comTicketPass">
        <ul class="passengersList">
            <li class="item">
                <div class="alignL">
                    <span>어른<i>(13세 이상)</i></span>
                </div>
                <div class="alignR">
                    <div class="pubIncDec">
                        <button class="btnNum minus" disabled>-1</button>
                        <span class="textNum">0<span class="blind">명</span></span>
                        <button class="btnNum plus">+1</button>
                    </div>
                </div>
            </li>
            <li class="item">
                <div class="alignL">
                    <span>어린이<i>(만6세 ~ 만12세)</i></span>
                </div>
                <div class="alignR">
                    <div class="pubIncDec">
                        <button class="btnNum minus" disabled>-1</button>
                        <span class="textNum">0<span class="blind">명</span></span>
                        <button class="btnNum plus">+1</button>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    
</body>
</html>
