<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/common/css/style.css">
    <script src="/common/js/swiper.js"></script>
    <script src="/common/js/common.js"></script>
    <title>탭 메뉴</title>
</head>
<body>
    <!--
        SCSS
        scss/module/_modTab.scss
    -->

    <!-- 탭 안 탭 (tabInTab) / sticky / swiperDirt 확장 예시 -->
    <div class="modTab">
        <!-- 내부 탭 기본 -->
        <div class="tabInTab">
            <div class="inTabSwiper swiper-container">
                <div class="swiper-wrapper inTabMenu">
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName on" title="선택 된 내부탭">Inner Tab 01</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Inner Tab 02</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Inner Tab 03</button></div>
                </div>
            </div>
            <div class="inTabContainer">
                <div class="inTabCont on">Inner Contents 0-0</div>
                <div class="inTabCont">Inner Contents 0-1</div>
                <div class="inTabCont">Inner Contents 0-2</div>
            </div>
        </div>

        <!-- 내부 탭 sticky + swiperDirt (탭이 많아 넘칠 때 방향 버튼) -->
        <div class="tabInTab sticky"><!-- sticky : 스크롤 시 탭 메뉴 상단 고정 -->
            <div class="inTabSwiper swiper-container">
                <div class="swiper-wrapper inTabMenu">
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName on" title="선택 된 내부탭">Sticky Inner 01</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Sticky Inner 02</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Sticky Inner 03</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Sticky Inner 04</button></div>
                    <div class="inTabItem swiper-slide"><button type="button" class="inTabName" title="내부탭">Sticky Inner 05</button></div>
                </div>
                <div class="swiperDirt"><!-- 탭 항목이 많아 스크롤 필요 시 표시 -->
                    <div class="dirtBox prev"><button type="button" class="btnDirt swiper-button-prev">이전</button></div>
                    <div class="dirtBox next"><button type="button" class="btnDirt swiper-button-next">다음</button></div>
                </div>
            </div>
            <div class="inTabContainer">
                <div class="inTabCont on">Sticky Inner Contents 0-0</div>
                <div class="inTabCont">Sticky Inner Contents 0-1</div>
                <div class="inTabCont">Sticky Inner Contents 0-2</div>
                <div class="inTabCont">Sticky Inner Contents 0-3</div>
                <div class="inTabCont">Sticky Inner Contents 0-4</div>
            </div>
        </div>
        
    </div>

</body>
</html>
